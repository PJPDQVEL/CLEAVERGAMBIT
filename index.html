<style>

</style>
<style>
#orn{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.orw{position:absolute;left:0;width:100%;overflow:hidden;animation:orbr 12s ease-in-out infinite}

  background:#7a62c0;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;-webkit-mask-size:auto 100%;mask-size:auto 100%;
  will-change:transform,opacity;animation:orsl var(--d,60s) linear infinite}

  </div>

  <div id="chess" class="ov" style="display:none"><div id="bd" class="bd"></div><p id="tk" style="color:#fff;min-height:2.4em;max-width:30em"></p><p id="cm"></p><div style="display:flex;gap:2vmin"><button id="cc" style="display:none">Continuar</button><button id="cd" style="display:none">Denunciar</button></div></div>

<script>
const W=320,H=180,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const pcv=document.getElementById('pcv'),pctx=pcv.getContext('2d');pcv.width=W;pcv.height=H;
const $=id=>document.getElementById(id);
const keys={};let S='splash',T=0,P,slimes,parts,decals,score,kills,spawnT,shake,best=0,cats,gloves,clouds,nextLv,lv,bossDone,bosses,banner,curCards=[],haz,rings,bul,bolts,bname='',rain=false,portal=null,portalT=0,nextRain=25,rainDot=9,flash=0,rainsWon=0,cb,cSel=-1,cLeg=[],cBusy=false,asnT=25,stab=null,cam={z:1,x:160,y:90},stabPrev=false;
try{best=+localStorage.getItem('anao-best')||0}catch(e){}

let bz=[],bossN=0,HM=0,AR={i:0,t:0},pzBank=null,pzCur=null;
const FIL={"Estoicos": ["Zenão de Cítio", "Cleantes de Assos", "Crisipo de Solos", "Panécio de Rodes", "Posidônio de Apameia", "Epicteto", "Sêneca", "Marco Aurélio", "Musônio Rufo", "Catão, o Jovem", "Cícero", "Justo Lípsio"], "Epicuristas": ["Epicuro", "Metrodoro de Lâmpsaco", "Hermarco de Mitilene", "Filodemo de Gadara", "Lucrécio", "Diógenes de Oenoanda", "Horácio", "Lorenzo Valla", "Montaigne", "Pierre Gassendi", "Michel Onfray"], "Céticos": ["Pirro de Élis", "Tímon de Fliunte", "Enesidemo", "Agripa", "Sexto Empírico", "Carnéades", "Arcesilau", "Montaigne", "David Hume", "Wittgenstein", "Karl Popper", "Barry Stroud"], "Idealistas": ["Platão", "Plotino", "Santo Agostinho", "Berkeley", "Kant", "Fichte", "Schelling", "Hegel", "Schopenhauer", "Bradley", "Josiah Royce", "Benedetto Croce"], "Existencialistas": ["Kierkegaard", "Nietzsche", "Dostoiévski", "Heidegger", "Karl Jaspers", "Sartre", "Simone de Beauvoir", "Albert Camus", "Gabriel Marcel", "Merleau-Ponty", "Unamuno", "Viktor Frankl"], "Analíticos": ["Frege", "Bertrand Russell", "G. E. Moore", "Wittgenstein", "Carnap", "Ayer", "Gilbert Ryle", "J. L. Austin", "Quine", "Saul Kripke", "Elizabeth Anscombe", "Derek Parfit"], "Fenomenólogos": ["Husserl", "Heidegger", "Max Scheler", "Edith Stein", "Eugen Fink", "Merleau-Ponty", "Levinas", "Michel Henry", "Paul Ricœur", "Jean-Luc Marion", "Jan Patočka", "Dan Zahavi"], "Pragmatistas": ["Charles S. Peirce", "William James", "John Dewey", "G. H. Mead", "Jane Addams", "F. C. S. Schiller", "Josiah Royce", "Alain Locke", "Richard Rorty", "Hilary Putnam", "Cheryl Misak", "Susan Haack"], "Cínicos": ["Antístenes", "Diógenes de Sinope", "Crates de Tebas", "Hipárquia de Maroneia", "Mônimo de Siracusa", "Bion de Borístenes", "Menipo de Gadara", "Demonax", "Luciano de Samósata", "Cioran", "Peter Sloterdijk", "Michel Foucault"]};
const fpc=document.createElement('canvas');fpc.width=W;fpc.height=H;let fT=-9;
/* ===== texturas do chão em pixel art de verdade: 1 pixel do jogo = 1 pixel da textura, sem foto e sem suavização ===== */
const TXC={};
function pxTex(st){
  if(TXC[st])return TXC[st];
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const A=a=>'rgba(255,255,255,'+a+')',K=a=>'rgba(0,0,0,'+a+')';
  const px=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1);};
  let sd=st*977+13;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const X0=24,Y0=22,X1=296,Y1=164;
  if(st===2){
    /* mãos saindo da escuridão: mesma silhueta, girada de 90 em 90 graus para continuar alinhada ao pixel */
    g.fillStyle=K(.34);g.fillRect(10,14,300,158);
    const HW=20,HH=25,M=[];for(let j=0;j<HH;j++)M.push(new Array(HW).fill(0));
    const R=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)M[j][i]=1;};
    R(3,11,15,10);R(6,21,8,4);                 /* palma e pulso */
    R(3,5,3,7);R(7,1,3,11);R(11,2,3,10);R(15,6,3,6);  /* quatro dedos, 3 px de largura e 1 px de vão */
    R(0,15,3,4);R(1,13,2,3);R(0,18,2,2);       /* polegar aberto para o lado */
    const hand=(ox,oy,rot,mir)=>{
      const pts=[];
      for(let j=0;j<HH;j++)for(let i=0;i<HW;i++)if(M[j][i]){let x=mir?HW-1-i:i,y=j;for(let r=0;r<rot;r++){const t=x;x=HH-1-y;y=t;}pts.push([x,y]);}
      const set=new Set(pts.map(p=>p[0]+','+p[1])),ed=new Set();
      pts.forEach(p=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{const k=(p[0]+d[0])+','+(p[1]+d[1]);if(!set.has(k))ed.add(k);}));
      ed.forEach(k=>{const q=k.split(',');px(ox+ +q[0],oy+ +q[1],A(.42));});
      pts.forEach(p=>px(ox+p[0],oy+p[1],A(.15)));
    };
    const used=[];let tries=0;
    while(used.length<0&&tries++<400){const x=14+Math.floor(rn()*270),y=18+Math.floor(rn()*130);if(used.every(u=>Math.hypot(u[0]-x,u[1]-y)>34)&&Math.hypot(x+12-160,y+12-100)>38){used.push([x,y]);hand(x,y,Math.floor(rn()*4),rn()<.5?1:0);}}
  }else{
    
    for(let y=Y0;y<Y1;y++)for(let x=X0;x<X1;x++){
      const u=Math.min(x-X0,X1-1-x),v=Math.min(y-Y0,Y1-1-y),d=Math.min(u,v),t=u<v?v:u;
      let col=null;
      if(d<2)col=A(.34);
      else if(d<4)col=K(.45);
      else if(d<16){
        const q=d-4;
        if(st===1){const m=Math.abs(t%12-5.5)+Math.abs(q-5.5);col=m<3?A(.38):m<5?A(.17):m<7?K(.12):K(.36);}
        else{const a=((t+q)%8)<4,b=((t-q+800)%8)<4;col=(a!==b)?A(.3):K(.34);}
      }
      else if(d<18)col=A(.26);
      else if(d<20)col=K(.4);
      else{
        if(st===1){
          const dm=Math.abs(x-160)*.62+Math.abs(y-93);
          if(dm<26){col=dm<5?A(.5):dm<7?K(.5):dm<9?A(.4):dm<14?(((x+y)&1)?A(.28):K(.3)):dm<16?A(.4):dm<18?K(.5):dm<22?A(.2):dm<24?A(.38):K(.45);}
          else{const ox=(u%14)-7,oy=(v%14)-7,m=Math.abs(ox)+Math.abs(oy);col=m===0?A(.42):(m===4?A(.17):K(.24));}

const KEYS=Object.keys(D),root=document.getElementById('orn');if(!root)return;
const IMG={};KEYS.forEach(k=>IMG[k]='url(data:image/png;base64,'+D[k].b64+')');
let rows=[],timers=[];
function show(r){
  const k=KEYS[r.idx%KEYS.length];r.idx++;
  const nx=r.cur===0?1:0,L=r.l[nx],P=r.l[r.cur===0?0:1],d=D[k],tw=Math.max(40,Math.round(d.w*r.rh/d.h));
  L.style.webkitMaskImage=IMG[k];L.style.maskImage=IMG[k];
  L.style.setProperty('--tw',tw+'px');L.style.setProperty('--d',(tw/r.sp).toFixed(1)+'s');
  L.classList.add('on');if(r.cur>=0)P.classList.remove('on');r.cur=nx;
}
function build(){
  timers.forEach(clearTimeout);timers=[];root.textContent='';rows=[];
  const vh=innerHeight,rh=Math.max(54,Math.min(96,Math.round(vh*.11))),gap=Math.round(rh*.2),n=Math.ceil(vh/(rh+gap))+1;
  for(let i=0;i<n;i++){
    const w=document.createElement('div');w.className='orw'+(i%2?' rv':'');
    w.style.top=(i*(rh+gap)-Math.round(rh*.35))+'px';w.style.height=rh+'px';
    w.style.animationDuration=(9+Math.random()*9).toFixed(1)+'s';w.style.animationDelay=(-Math.random()*12).toFixed(1)+'s';
    const l=[0,1].map(()=>{const e=document.createElement('div');e.className='orl';w.appendChild(e);return e;});
    root.appendChild(w);
    const r={l,cur:-1,idx:(i*2+Math.floor(Math.random()*3))%KEYS.length,rh,sp:10+(i%4)*5};
    rows.push(r);show(r);
    const loop=()=>{show(r);timers.push(setTimeout(loop,9000+Math.random()*7000));};
    timers.push(setTimeout(loop,4000+Math.random()*9000));
  }
}
build();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,250);});
})();
